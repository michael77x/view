<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanCo | Mockups navegables</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .simple-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .simple-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .simple-header a {
      text-decoration: none;
      font-weight: 700;
      color: #111827;
      border: 1px solid #cad1da;
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      font-size: 12px;
    }

    .preview-card {
      margin-top: 10px;
      background: #ffffff;
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      padding: 10px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .toolbar-row strong {
      font-size: 12px;
      color: #4b5565;
      margin-right: 4px;
    }

    .tool-btn {
      border: 1px solid #d1d1d1;
      background: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #1a1d24;
      cursor: pointer;
    }

    .tool-btn.active {
      background: #c5ea74;
      border-color: #aed85c;
    }

    .module-help {
      margin: 0 0 10px;
      border: 1px solid #d9e9b5;
      background: #f3fbdf;
      color: #344a17;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .stage-wrap {
      background: #ececec;
      border: 1px solid #d3d3d3;
      border-radius: 10px;
      padding: 10px;
      overflow: auto;
      display: flex;
      justify-content: center;
    }

    .device-shell {
      border: 1px solid #bfc4cc;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      transition: width .2s ease, height .2s ease;
    }

    .device-shell.web { width: 1360px; height: 820px; }
    .device-shell.tablet { width: 900px; height: 1180px; }
    .device-shell.mobile { width: 390px; height: 844px; }

    .device-shell iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="simple-header">
      <h1>Mockups</h1>
      <a href="../index.html">Volver</a>
    </header>

    <section class="preview-card">
      <div class="toolbar-row" id="deviceToolbar">
        <strong>Dispositivo:</strong>
        <button class="tool-btn active" data-device="web">Web</button>
        <button class="tool-btn" data-device="tablet">Tablet</button>
        <button class="tool-btn" data-device="mobile">Mobile</button>
      </div>

      <div class="toolbar-row" id="screenToolbar">
        <strong>Pantalla:</strong>
        <button class="tool-btn active" data-screen="app-shell.html" data-help="Vista general del sistema con KPIs y accesos rápidos por módulo.">App Shell</button>
        <button class="tool-btn" data-screen="login.html" data-help="Autenticación de usuario y acceso seguro al sistema.">Login</button>
        <button class="tool-btn" data-screen="usuarios-permisos.html" data-help="Administración de usuarios, perfiles y permisos por opción.">Usuarios</button>
        <button class="tool-btn" data-screen="maestros.html" data-help="Mantenimiento de catálogos base: proveedores, puertos y agentes.">Maestros</button>
        <button class="tool-btn" data-screen="planeamiento.html" data-help="Planificación de compras por SKU con indicadores LeadTime, PMM y TEP.">Planeamiento</button>
        <button class="tool-btn" data-screen="sincronizacion.html" data-help="Ejecución y control de tareas de sincronización de datos.">Sincronización</button>
        <button class="tool-btn" data-screen="tracking.html" data-help="Seguimiento operativo de órdenes de compra importadas y sus hitos.">Tracking</button>
        <button class="tool-btn" data-screen="config-seguimiento.html" data-help="Parámetros globales que afectan cálculos de seguimiento y ETA.">Configuración</button>
        <button class="tool-btn" data-screen="pwa-mobile.html" data-help="Operación móvil PWA con trabajo offline, cola local y sincronización.">PWA Mobile</button>
      </div>

      <p class="module-help" id="moduleHelp">¿Para qué sirve?: Vista general del sistema con KPIs y accesos rápidos por módulo.</p>

      <div class="stage-wrap">
        <div class="device-shell web" id="deviceShell">
          <iframe id="mockFrame" src="app-shell.html" title="Vista previa mockup"></iframe>
        </div>
      </div>


    </section>
  </div>

  <script>
    const deviceShell = document.getElementById('deviceShell');
    const mockFrame = document.getElementById('mockFrame');
    const deviceButtons = document.querySelectorAll('#deviceToolbar .tool-btn');
    const screenButtons = document.querySelectorAll('#screenToolbar .tool-btn');
    const moduleHelp = document.getElementById('moduleHelp');

    function activate(buttons, activeBtn) {
      buttons.forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    deviceButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        activate(deviceButtons, btn);
        const mode = btn.dataset.device;
        deviceShell.classList.remove('web', 'tablet', 'mobile');
        deviceShell.classList.add(mode);
      });
    });

    function setScreen(screen, helpText) {
      mockFrame.src = screen;
      screenButtons.forEach(b => b.classList.toggle('active', b.dataset.screen === screen));
      moduleHelp.textContent = `¿Para qué sirve?: ${helpText}`;
    }

    screenButtons.forEach(btn => {
      btn.addEventListener('click', () => setScreen(btn.dataset.screen, btn.dataset.help));
    });


  </script>
</body>
</html>
