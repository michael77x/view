<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockup | Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <section class="app-shell" style="grid-template-columns: 1fr; min-height: 540px; max-width: 520px; margin: 0 auto;">
      <main class="main" style="border-right:0; display:grid; align-content:center; background:#f5f5f5;">
        <form class="form-card" style="margin:auto;">
          <h4 style="margin:0 0 4px; font-size:24px;">Iniciar sesión</h4>
          <p style="margin-bottom:16px;">Ingrese sus credenciales para acceder al sistema.</p>

          <div class="form-group">
            <label for="usuario">Usuario</label>
            <input id="usuario" class="input" type="text" placeholder="ej: admin" />
          </div>

          <div class="form-group">
            <label for="clave">Contraseña</label>
            <input id="clave" class="input" type="password" placeholder="••••••••" />
          </div>

          <div class="checkbox-row">
            <input id="recordarme" type="checkbox" />
            <label for="recordarme" style="margin:0; font-weight:500;">Recordarme en este dispositivo</label>
          </div>

          <div class="btn-bar">
            <button type="button" class="btn primary">Ingresar</button>
          </div>
        </form>
      </main>
    </section>
  </div>
</body>
</html>
