<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanCo | Centro PWA</title>
  <style>
    :root {
      --lime: #b8eb5b;
      --ink: #121722;
      --muted: #5f6675;
      --line: #d9d9d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 20%, #c7ef77 0%, var(--lime) 62%, #abd74d 100%);
    }

    .home {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(15, 21, 33, .14);
    }

    h1 { margin: 0 0 6px; font-size: 30px; }
    p { margin: 0 0 16px; color: var(--muted); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn {
      text-decoration: none;
      border: 1px solid #d0d0d0;
      border-radius: 9px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #121722;
      background: #fff;
    }

    .btn.primary {
      background: #11151d;
      border-color: #11151d;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="home">
    <h1>PlanCo Mockups</h1>
    <p>Accesos directos a planificación y pantallas navegables.</p>

    <div class="actions">
      <a class="btn" href="fases.html">Fases</a>
      <a class="btn primary" href="screens/index.html">Mockups</a>
    </div>
  </main>
</body>
</html>
